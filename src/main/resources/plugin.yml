name: HermitCore
version: '${project.version}'
main: net.coruptical.hermitcore.HermitCore
api-version: 1.19
authors: [ Coruptical ]
description: Core plugin for managing smp server
commands:
  staffchat:
    aliases:
      - sc
      - staffc
    description: Allows players to enable/disable staff chat.
  staffmenu:
    aliases:
      - sm
      - adminmenu
    description: Opens the staff/admin management menu.
  restorechest:
    description: Allows players to restore chests from older using coordinates.
    aliases:
      - rc
      - chestrestore