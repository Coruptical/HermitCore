# Staff chat use permission
StaffChatPermission: 'hermitcore.staff.chat'

# Message to send to players if they don't have a permission
NoPermissionMessage: '&cYou dont have permissions to use this command.'

# This permission allows players to use /staffmenu command
StaffMenuPermission: 'hermitcore.staff.menu'

# This permission allows players to restore chests from older dates.
ChestRestorePermission: 'hermitcore.staff.restorechest'

# This value controls how often we save player chest data.
# Valid values are given in s (SECONDS), m (MINUTES), and h (HOURS).
ChestSaveInterval: '5m'
